spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:fraudshield-auth-service}
  application:
    name: ledger-service
  mongodb:
    host: ${MONGO_LEDGER_HOST}
    port: ${MONGO_LEDGER_PORT}
    database: ${MONGO_LEDGER_DB}
    username: ${MONGO_LEDGER_USER}
    password: ${MONGO_LEDGER_PASSWORD}
    authentication-database: admin
    representation:
      uuid: standard
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fraudetection.ledger_service.dto.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fraudetection.ledger_service.dto.event.KafkaEventEnvelope
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 8086

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
