spring:
  application:
    name: account-service
  datasource:
    url: ${POSTGRES_ACCOUNT_URL}
    username: ${POSTGRES_ACCOUNT_USER}
    password: ${POSTGRES_ACCOUNT_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fraudetection.account_service.dto.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fraudetection.account_service.dto.event.KafkaEventEnvelope
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8082

jwt:
  issuer: ${JWT_ISSUER:fraudshield-auth-service}

service-client:
  id: account-service
  secret: ${SERVICE_CLIENT_ACCOUNT_SECRET:}

pix:
  lookup-ttl: 5m
  lookups-per-minute: 20

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
