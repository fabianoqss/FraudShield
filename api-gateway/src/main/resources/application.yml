spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/accounts/**
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/transactions/**
            - id: ledger-service
              uri: ${LEDGER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/ledger/**
            # OpenAPI spec of the service; the path is fixed so this route reaches nothing else.
            - id: auth-service-api-docs
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api-docs/auth
              filters:
                - SetPath=/v3/api-docs
            # OpenAPI spec of the service; the path is fixed so this route reaches nothing else.
            - id: account-service-api-docs
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api-docs/account
              filters:
                - SetPath=/v3/api-docs
            # OpenAPI spec of the service; the path is fixed so this route reaches nothing else.
            - id: transaction-service-api-docs
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api-docs/transaction
              filters:
                - SetPath=/v3/api-docs
            # OpenAPI spec of the service; the path is fixed so this route reaches nothing else.
            - id: ledger-service-api-docs
              uri: ${LEDGER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api-docs/ledger
              filters:
                - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    urls:
      - name: auth-service
        url: /api-docs/auth
      - name: account-service
        url: /api-docs/account
      - name: transaction-service
        url: /api-docs/transaction
      - name: ledger-service
        url: /api-docs/ledger

jwt:
  issuer: ${JWT_ISSUER:fraudshield-auth-service}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
