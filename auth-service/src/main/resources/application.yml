spring:
  application:
    name: auth-service
  datasource:
    url: ${POSTGRES_AUTH_URL}
    username: ${POSTGRES_AUTH_USER}
    password: ${POSTGRES_AUTH_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

jwt:
  issuer: ${JWT_ISSUER:fraudshield-auth-service}
  private-key: ${JWT_PRIVATE_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  service-token-expiration-ms: ${SERVICE_TOKEN_EXPIRATION_MS:300000}

service-clients:
  clients:
    account-service:
      secret: ${SERVICE_CLIENT_ACCOUNT_SECRET:}
      scopes:
        - users:lookup

refresh-token:
  expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-exclude: /auth/service-token, /auth/users/lookup, /.well-known/**

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
