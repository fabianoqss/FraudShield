services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: fraudshield-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-account:
    image: postgres:16-alpine
    container_name: fraudshield-postgres-account
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: ${POSTGRES_ACCOUNT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ACCOUNT_PASSWORD}
    ports:
      - "5442:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ACCOUNT_USER} -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-transaction:
    image: postgres:16-alpine
    container_name: fraudshield-postgres-transaction
    restart: unless-stopped
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: ${POSTGRES_TRANSACTION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TRANSACTION_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_transaction_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TRANSACTION_USER} -d transaction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../auth-service
    container_name: fraudshield-auth-service
    restart: unless-stopped
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      POSTGRES_AUTH_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8081:8081"
    profiles: ["services"]

  account-service:
    build:
      context: ../account-service
    container_name: fraudshield-account-service
    restart: unless-stopped
    depends_on:
      postgres-account:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      POSTGRES_ACCOUNT_URL: jdbc:postgresql://postgres-account:5432/account_db
      POSTGRES_ACCOUNT_USER: ${POSTGRES_ACCOUNT_USER}
      POSTGRES_ACCOUNT_PASSWORD: ${POSTGRES_ACCOUNT_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8082:8082"
    profiles: ["services"]

  transaction-service:
    build:
      context: ../transaction-service
    container_name: fraudshield-transaction-service
    restart: unless-stopped
    depends_on:
      postgres-transaction:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      POSTGRES_TRANSACTION_URL: jdbc:postgresql://postgres-transaction:5432/transaction_db
      POSTGRES_TRANSACTION_USER: ${POSTGRES_TRANSACTION_USER}
      POSTGRES_TRANSACTION_PASSWORD: ${POSTGRES_TRANSACTION_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8083:8083"
    profiles: ["services"]

  api-gateway:
    build:
      context: ../api-gateway
    container_name: fraudshield-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      JWT_SECRET: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    profiles: ["services"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fraudshield-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraudshield-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

  redis:
    image: redis:7.4-alpine
    container_name: fraudshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: fraudshield-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: fraudshield-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: fraudshield-tempo
    restart: unless-stopped
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fraudshield-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  postgres_auth_data:
  postgres_account_data:
  postgres_transaction_data:
  prometheus_data:
  tempo_data:
  grafana_data:
