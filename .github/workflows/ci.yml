name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.java.outputs.changes }}
      ml: ${{ steps.other.outputs.ml-model-service }}
      frontend: ${{ steps.other.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      # A change to this workflow re-runs every component, so CI edits are always exercised.
      - id: java
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service: [auth-service/**, .github/workflows/ci.yml]
            account-service: [account-service/**, .github/workflows/ci.yml]
            transaction-service: [transaction-service/**, .github/workflows/ci.yml]
            fraud-detection-service: [fraud-detection-service/**, .github/workflows/ci.yml]
            ledger-service: [ledger-service/**, .github/workflows/ci.yml]
            notification-service: [notification-service/**, .github/workflows/ci.yml]
            api-gateway: [api-gateway/**, .github/workflows/ci.yml]
      - id: other
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ml-model-service: [ml-model-service/**, .github/workflows/ci.yml]
            # frontend/ is not on main yet; add .github/workflows/ci.yml here once it is.
            frontend: [frontend/**]

  java:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.java != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      # verify = compile + unit tests + Testcontainers integration tests (Docker is available on the runner).
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  ml-model-service:
    name: ml-model-service
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml-model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-model-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Single status to require in the branch ruleset: jobs skipped by the path filter would
  # otherwise leave required checks pending forever.
  ci-success:
    name: CI result
    needs: [changes, java, ml-model-service, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
      - run: echo "All required CI jobs passed or were not needed."
